<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mundial 2026">
<title>FIFA World Cup 2026</title>
<style>
:root{
  --gold:#C9A84C;--dark:#0A1628;--accent:#2E7DD1;
  --win:#1D9E75;--win-bg:#E1F5EE;
  --bg:#ffffff;--bg2:#f5f5f3;--bg3:#ebebea;
  --text1:#1a1a18;--text2:#6b6b67;--text3:#9b9b97;
  --border1:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);
  --radius:10px;--radius-sm:7px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#141414;--bg2:#1e1e1e;--bg3:#282828;
  --text1:#f0f0ee;--text2:#a0a09c;--text3:#606060;
  --border1:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text1);min-height:100vh}
.app{max-width:640px;margin:0 auto;padding:0 0 80px}
.header{text-align:center;padding:20px 16px 14px;background:var(--dark);color:#fff}
.header h1{font-size:20px;font-weight:600;letter-spacing:0.3px}
.header .sub{font-size:12px;color:rgba(255,255,255,0.6);margin-top:3px}
.trophy-row{font-size:28px;margin-bottom:5px}
.save-banner{background:#1D9E7522;border-bottom:1px solid #1D9E7544;padding:5px 16px;font-size:12px;color:var(--win);text-align:center;display:none}
.save-banner.show{display:block}
.tabs-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:0.5px solid var(--border1);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0px)}
.tab-btn{flex:1;padding:9px 2px 7px;border:none;background:transparent;cursor:pointer;font-size:10px;font-weight:500;color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:2px}
.tab-btn.active{color:var(--accent)}
.tab-icon{font-size:17px;line-height:1}
.section{display:none;padding:14px 12px 0}.section.active{display:block}
.group-selector{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.gsel{padding:5px 11px;border:0.5px solid var(--border1);background:var(--bg2);border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;color:var(--text2)}
.gsel.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.card{background:var(--bg);border:0.5px solid var(--border1);border-radius:var(--radius);overflow:hidden;margin-bottom:10px}
.card-title{font-size:11px;font-weight:600;color:var(--text3);padding:9px 12px 5px;text-transform:uppercase;letter-spacing:0.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;font-weight:600;color:var(--text3);padding:5px 4px;border-bottom:0.5px solid var(--border1);text-transform:uppercase;letter-spacing:0.3px}
td{padding:7px 4px;border-bottom:0.5px solid var(--border1)}
tr:last-child td{border-bottom:none}
.t-name{font-weight:500;color:var(--text1)}.t-num{text-align:center;color:var(--text2)}.t-pts{text-align:center;font-weight:600;color:var(--text1)}
tr.q1 td:first-child{border-left:3px solid var(--win)}
tr.q2 td:first-child{border-left:3px solid var(--accent)}
tr.q3 td:first-child{border-left:3px solid #BA7517}
.pos{display:inline-flex;width:19px;height:19px;border-radius:4px;font-size:10px;font-weight:600;align-items:center;justify-content:center;margin-right:3px}
.pos1{background:rgba(201,168,76,0.15);color:#8a6000}.pos2{background:rgba(46,125,209,0.15);color:#185FA5}.pos3{background:rgba(186,117,23,0.15);color:#8a4f00}.pos4{background:var(--bg3);color:var(--text3)}
.team-chip{display:inline-flex;align-items:center;gap:5px}
.team-badge{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:-0.3px}
/* MATCH CARD */
.match-card{background:var(--bg);border:0.5px solid var(--border1);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.match-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.match-info{font-size:11px;color:var(--text3)}
.status-badge{font-size:10px;padding:2px 7px;border-radius:100px;font-weight:600}
.s-pending{background:var(--bg2);color:var(--text3)}.s-live{background:#FAECE7;color:#993C1D}.s-done{background:var(--win-bg);color:#0F6E56}
.match-row{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.mteam{font-size:13px;font-weight:500;color:var(--text1);display:flex;align-items:center;gap:5px}
.mteam.right{justify-content:flex-end;flex-direction:row-reverse}
.score-wrap{display:flex;gap:3px;align-items:center}
.score-in{width:36px;height:30px;text-align:center;font-size:15px;font-weight:600;border:0.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text1);-moz-appearance:textfield;-webkit-appearance:none}
.score-in::-webkit-outer-spin-button,.score-in::-webkit-inner-spin-button{-webkit-appearance:none}
.score-in:focus{outline:none;border-color:var(--accent)}
.score-sep{font-size:15px;font-weight:600;color:var(--text3)}
.match-actions{display:flex;justify-content:flex-end;gap:5px;margin-top:8px}
.btn{padding:5px 11px;font-size:12px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);cursor:pointer;background:transparent;color:var(--text2);font-weight:500}
.btn:active{opacity:0.7}
.btn-ok{border-color:var(--win);color:var(--win)}.btn-ok:active{background:var(--win-bg)}
.btn-danger{border-color:#D85A30;color:#D85A30}
/* QUINIELA */
.quiniela-card{background:var(--bg);border:0.5px solid var(--border1);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.q-info{font-size:11px;color:var(--text3)}
.q-points-badge{font-size:10px;padding:2px 8px;border-radius:100px;font-weight:600}
.qp-pending{background:var(--bg2);color:var(--text3)}
.qp-exact{background:#E8C96A30;color:#8a6000}
.qp-result{background:#E1F5EE;color:#0F6E56}
.qp-wrong{background:#FAECE7;color:#993C1D}
.q-row{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.q-team{font-size:12px;font-weight:500;color:var(--text1);display:flex;align-items:center;gap:4px}
.q-team.right{justify-content:flex-end;flex-direction:row-reverse}
.q-score-in{width:34px;height:28px;text-align:center;font-size:14px;font-weight:600;border:0.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text1);-moz-appearance:textfield;-webkit-appearance:none}
.q-score-in::-webkit-outer-spin-button,.q-score-in::-webkit-inner-spin-button{-webkit-appearance:none}
.q-score-in:focus{outline:none;border-color:#BA7517}
.q-score-in.locked{background:var(--bg3);color:var(--text3);border-color:var(--border1)}
.q-real{font-size:11px;color:var(--text2);text-align:center;margin-top:4px}
.q-actions{display:flex;justify-content:flex-end;margin-top:7px}
.btn-q{padding:4px 11px;font-size:12px;border:0.5px solid #BA7517;border-radius:var(--radius-sm);cursor:pointer;background:transparent;color:#BA7517;font-weight:500}
.btn-q:active{background:#BA751715}
/* QUINIELA HEADER */
.q-header{background:var(--bg2);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.q-score-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.q-score-box{text-align:center}
.q-score-num{font-size:22px;font-weight:600;color:var(--text1)}
.q-score-lbl{font-size:10px;color:var(--text2);margin-top:1px}
.q-score-gold{color:#8a6000}
.q-score-green{color:#0F6E56}
.q-score-red{color:#993C1D}
.q-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--text2);border-top:0.5px solid var(--border1);padding-top:8px}
.q-leg{display:flex;align-items:center;gap:5px}
.q-leg-dot{width:8px;height:8px;border-radius:2px}
/* BRACKET */
.bracket-round{margin-bottom:16px}
.round-hdr{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:7px;padding-bottom:5px;border-bottom:0.5px solid var(--border1);display:flex;justify-content:space-between}
.round-date{font-size:10px;color:var(--text3);font-weight:400;text-transform:none;letter-spacing:0}
.bracket-grid{display:grid;gap:7px}
.bracket-grid.two{grid-template-columns:1fr 1fr}
.b-match{background:var(--bg);border:0.5px solid var(--border1);border-radius:var(--radius);padding:9px 11px}
.b-match.tbd{opacity:0.5}
.b-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.b-num{font-size:10px;color:var(--text3)}
.b-expected{font-size:10px;color:var(--accent);font-style:italic;margin-bottom:4px}
.b-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:5px;align-items:center}
.bteam{font-size:12px;font-weight:500;color:var(--text1);display:flex;align-items:center;gap:4px}
.bteam.right{justify-content:flex-end;flex-direction:row-reverse}
.bteam.tbd-t{color:var(--text3);font-style:italic;font-weight:400}
/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.stat-box{background:var(--bg2);border-radius:var(--radius-sm);padding:11px 7px;text-align:center}
.stat-n{font-size:22px;font-weight:600;color:var(--text1)}.stat-l{font-size:10px;color:var(--text2);margin-top:2px}
.leaders-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.leader-box{background:var(--bg2);border-radius:var(--radius-sm);padding:7px 9px}
.leader-g{font-size:10px;color:var(--text3);margin-bottom:2px;font-weight:600}
.leader-name{font-size:11px;font-weight:600;color:var(--text1);line-height:1.3}
.leader-pts{font-size:10px;color:var(--text2)}
.legend{display:flex;gap:10px;flex-wrap:wrap;padding:7px 0 3px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.leg-dot{width:9px;height:9px;border-radius:2px}
.reset-row{padding:14px 0 4px;display:flex;justify-content:flex-end}
/* CALENDAR SECTION */
.cal-section{margin-bottom:16px}
.cal-round-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;padding:8px 0 5px;border-bottom:0.5px solid var(--border1);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.cal-add-all{padding:3px 10px;font-size:11px;border:0.5px solid var(--accent);border-radius:100px;cursor:pointer;background:transparent;color:var(--accent);font-weight:500}
.cal-matches{display:flex;flex-direction:column;gap:5px}
.cal-match{background:var(--bg2);border-radius:var(--radius-sm);padding:8px 11px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-match-info{flex:1;min-width:0}
.cal-teams{font-size:13px;font-weight:500;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-meta{font-size:11px;color:var(--text3);margin-top:1px}
.cal-btn{flex-shrink:0;padding:4px 10px;font-size:11px;border:0.5px solid var(--accent);border-radius:100px;cursor:pointer;background:transparent;color:var(--accent);font-weight:500;white-space:nowrap}
.cal-btn.added{border-color:var(--win);color:var(--win)}
.cal-intro{background:var(--bg2);border-radius:var(--radius);padding:11px 13px;margin-bottom:12px;font-size:13px;color:var(--text2);line-height:1.5}
.cal-intro strong{color:var(--text1)}
.cal-add-all-btn{width:100%;padding:10px;font-size:13px;font-weight:600;border:0.5px solid var(--accent);border-radius:var(--radius);cursor:pointer;background:transparent;color:var(--accent);margin-bottom:14px}
</style>
</head>
<body>
<div class="app">

    </div>

  <div id="sec-matches" class="section">
    <div class="group-selector" id="mgsel"></div>
    <div id="matches-view"></div>
  </div>

  <div id="sec-quiniela" class="section">

  <div id="sec-bracket" class="section">

  </div>

  <div id="sec-calendar" class="section">

    </div>
    <div id="calendar-view"></div>
  </div>

  <div id="sec-stats" class="section">
    <div class="stats-grid" id="stats-grid"></div>

</div>

<div class="tabs-bar">

</div>

function initData(){

      for(let i=0;i<T.length;i++)for(let j=i+1;j<T.length;j++)
        S.quiniela[g].push({id:id++,home:T[i],away:T[j],ph:null,pa:null,locked:false});
    }
  });
  if(!S.knockoutMatches) S.knockoutMatches={};
  [{round:'r32',f:R32_FIXTURES},{round:'r16',f:R16_FIXTURES},{round:'qf',f:QF_FIXTURES},{round:'sf',f:SF_FIXTURES},{round:'final',f:FINAL_FIXTURES}].forEach(({round,f})=>{

// ── HELPERS ───────────────────────────────────────────────────────────────────
function badge(t){
  const c=COLORS[t]||'#555';
  const init=t.split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase();
  return`<span class="team-badge" style="background:${c}">${init}</span>`;
}
function calcS(g){
  const base=GROUPS[g].map(t=>({team:t,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0}));
  S.groupMatches[g].forEach(m=>{
    if(m.status!=='done')return;
    const h=base.find(x=>x.team===m.home),a=base.find(x=>x.team===m.away);
    h.pj++;a.pj++;h.gf+=m.sh;h.gc+=m.sa;a.gf+=m.sa;a.gc+=m.sh;
    if(m.sh>m.sa){h.g++;h.pts+=3;a.p++;}
    else if(m.sh<m.sa){a.g++;a.pts+=3;h.p++;}
    else{h.e++;h.pts++;a.e++;a.pts++;}
  });
  base.sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf);
  S.standings[g]=base;
}
function resolveTeam(key){
  if(!key)return'Por definir';
  if(/^[12][A-L]$/.test(key)){const pos=parseInt(key[0])-1,g=key[1];calcS(g);return(S.standings[g]&&S.standings[g][pos])?S.standings[g][pos].team:'Por definir';}
  if(key==='3m')return'Mejor 3°';
  if(/^W\d+$/.test(key)){
    const mid=parseInt(key.slice(1));
    for(const r of Object.keys(S.knockoutMatches)){
      const m=S.knockoutMatches[r].find(x=>x.id===mid);
      if(m&&m.status==='done'){return m.sh>m.sa?m.homeTeam:m.sa>m.sh?m.awayTeam:'Por definir';}
    }return'Por definir';
  }
  return key;
}
function resolveKnockout(){
  Object.keys(S.knockoutMatches).forEach(r=>{
    S.knockoutMatches[r].forEach(m=>{m.homeTeam=resolveTeam(m.homeKey);m.awayTeam=resolveTeam(m.awayKey);});
  });
}

// ── QUINIELA SCORING ──────────────────────────────────────────────────────────
// Marcador exacto: 3 pts · Resultado correcto (G/E/P): 1 pt · Incorrecto: 0
function quinielaScore(g){
  let exact=0,result=0,wrong=0,pending=0;
  S.quiniela[g].forEach(q=>{
    const real=S.groupMatches[g].find(m=>m.home===q.home&&m.away===q.away);
    if(!real||real.status!=='done'||q.ph===null||q.pa===null){pending++;return;}
    if(q.ph===real.sh&&q.pa===real.sa){exact++;return;}
    const predResult=q.ph>q.pa?'H':q.ph<q.pa?'A':'D';
    const realResult=real.sh>real.sa?'H':real.sh<real.sa?'A':'D';
    if(predResult===realResult)result++;else wrong++;
  });
  return{exact,result,wrong,pending,pts:exact*3+result*1};
}
function quinielaTotal(){
  let total={exact:0,result:0,wrong:0,pending:0,pts:0};
  GL.forEach(g=>{const s=quinielaScore(g);total.exact+=s.exact;total.result+=s.result;total.wrong+=s.wrong;total.pending+=s.pending;total.pts+=s.pts;});
  return total;
}

      if(q.ph===real.sh&&q.pa===real.sa){pts=3;badgeClass='qp-exact';badgeLabel='¡Exacto! +3';}
      else{
        const pr=q.ph>q.pa?'H':q.ph<q.pa?'A':'D';
        const rr=real.sh>real.sa?'H':real.sh<real.sa?'A':'D';
        if(pr===rr){pts=1;badgeClass='qp-result';badgeLabel='Resultado +1';}
        else{pts=0;badgeClass='qp-wrong';badgeLabel='Incorrecto';}
      }
    }else if(played&&(q.ph===null||q.pa===null)){badgeClass='qp-wrong';badgeLabel='Sin predicción';}
    const locked=q.locked||played;
    return`<div class="quiniela-card">
      <div class="q-meta"><span class="q-info">Grupo ${g} · P${q.id+1}</span><span class="q-points-badge ${badgeClass}">${badgeLabel}</span></div>
      <div class="q-row">
        <div class="q-team">${badge(q.home)}<span>${q.home}</span></div>
        <div class="score-wrap">
          <input class="q-score-in${locked?' locked':''}" type="number" min="0" max="99" value="${q.ph!==null?q.ph:''}" placeholder="–" ${locked?'disabled':''} id="qh_${g}_${q.id}" onchange="updQ('${g}',${q.id},'h',this.value)">
          <span class="score-sep">–</span>
          <input class="q-score-in${locked?' locked':''}" type="number" min="0" max="99" value="${q.pa!==null?q.pa:''}" placeholder="–" ${locked?'disabled':''} id="qa_${g}_${q.id}" onchange="updQ('${g}',${q.id},'a',this.value)">
        </div>
        <div class="q-team right"><span>${q.away}</span>${badge(q.away)}</div>
      </div>
      ${played?`<div class="q-real">Resultado real: ${real.sh} – ${real.sa}</div>`:''}
      <div class="q-actions">
        ${!locked?`<button class="btn-q" onclick="lockQ('${g}',${q.id})">Guardar predicción</button>`:''}
      </div></div>`;
  }).join('');
}

function renderBracket(){
  resolveKnockout();
  const rounds=[
    {id:'r32',label:'Ronda de 32',date:'28 jun – 3 jul',two:true},
    {id:'r16',label:'Octavos de final',date:'4 – 7 jul',two:true},
    {id:'qf',label:'Cuartos de final',date:'9 – 11 jul',two:true},
    {id:'sf',label:'Semifinales',date:'14 – 15 jul',two:true},
    {id:'final',label:'Gran Final',date:'19 jul · MetLife Stadium',two:false},
  ];
  document.getElementById('bracket-view').innerHTML=rounds.map(r=>{
    const ms=S.knockoutMatches[r.id];
    return`<div class="bracket-round">
      <div class="round-hdr"><span>${r.label}</span><span class="round-date">${r.date}</span></div>
      <div class="bracket-grid${r.two?' two':''}">
        ${ms.map(m=>{
          const tbd=!m.homeTeam||m.homeTeam==='Por definir';
          const sc=m.status==='done'?'s-done':m.status==='live'?'s-live':'s-pending';
          const sl=m.status==='done'?'Final':m.status==='live'?'VIVO':'Pendiente';
          const hL=m.homeTeam||m.homeKey,aL=m.awayTeam||m.awayKey;
          return`<div class="b-match${tbd?' tbd':''}">
            <div class="b-meta"><span class="b-num">M${m.id} · ${m.date}</span><span class="status-badge ${sc}">${sl}</span></div>
            ${tbd?`<div class="b-expected">${m.homeKey} vs ${m.awayKey}</div>`:''}
            <div class="b-teams">
              <div class="bteam${tbd?' tbd-t':''}">${tbd?'':badge(m.homeTeam)}<span>${hL}</span></div>
              <div class="score-wrap">
                <input class="score-in" type="number" min="0" max="99" value="${m.sh!==null?m.sh:''}" placeholder="–" style="width:32px;height:28px;font-size:13px" onchange="updKS('${r.id}',${m.id},'h',this.value)">
                <span class="score-sep">–</span>
                <input class="score-in" type="number" min="0" max="99" value="${m.sa!==null?m.sa:''}" placeholder="–" style="width:32px;height:28px;font-size:13px" onchange="updKS('${r.id}',${m.id},'a',this.value)">
              </div>
              <div class="bteam right${tbd?' tbd-t':''}"><span>${aL}</span>${tbd?'':badge(m.awayTeam)}</div>
            </div>
            <div class="match-actions">
              ${m.status!=='done'?`<button class="btn btn-ok" onclick="confKM('${r.id}',${m.id})">Confirmar</button>`:`<button class="btn" onclick="rstKM('${r.id}',${m.id})">Editar</button>`}
            </div></div>`;
        }).join('')}</div></div>`;
  }).join('');
}

function renderCalendar(){
  // Agrupar por ronda
  const rounds={};
  ALL_MATCHES_CAL.forEach(m=>{
    if(!rounds[m.r])rounds[m.r]=[];
    rounds[m.r].push(m);
  });
  const roundOrder=['Grupo A','Grupo B','Grupo C','Grupo D','Grupo E','Grupo F','Grupo G','Grupo H','Grupo I','Grupo J','Grupo K','Grupo L','Ronda de 32','Octavos de final','Cuartos de final','Semifinales','Tercer lugar','Gran Final'];
  let html='';
  // Botón agregar todos
  html+=`<button class="cal-add-all-btn" onclick="addAllToCalendar()">&#128197; Agregar todos los 104 partidos a Google Calendar</button>`;
  roundOrder.forEach(rnd=>{
    if(!rounds[rnd])return;
    html+=`<div class="cal-section">
      <div class="cal-round-title">
        <span>${rnd}</span>
        <button class="cal-add-all" onclick="addRoundToCalendar('${rnd}')">Agregar todos</button>
      </div>
      <div class="cal-matches">
        ${rounds[rnd].map(m=>`<div class="cal-match">
          <div class="cal-match-info">
            <div class="cal-teams">${m.h} vs ${m.a}</div>
            <div class="cal-meta">${formatCalDate(m.d)} · ${formatTime(m.t)} · ${m.v}</div>
          </div>
          <button class="cal-btn" id="calbtn_${m.id}" onclick="addOneToCalendar('${m.id}')">&#43; Cal</button>
        </div>`).join('')}
      </div></div>`;
  });
  document.getElementById('calendar-view').innerHTML=html;
}

function formatCalDate(d){
  const months=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const y=d.slice(0,4),mo=parseInt(d.slice(4,6)),dd=parseInt(d.slice(6,8));
  const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const dow=new Date(y,mo-1,dd).getDay();
  return`${days[dow]} ${dd} ${months[mo]}`;
}
function formatTime(t){
  const h=parseInt(t.slice(0,2)),m=t.slice(2,4);
  return`${h}:${m} CDT`;
}
function makeGCalUrl(m){
  const start=`${m.d}T${m.t}00`;
  // duración 2 horas
  const endH=String(parseInt(m.t.slice(0,2))+2).padStart(2,'0');
  const end=`${m.d}T${endH}${m.t.slice(2,4)}00`;
  const title=encodeURIComponent(`⚽ ${m.h} vs ${m.a} | FIFA WC 2026`);
  const details=encodeURIComponent(`FIFA World Cup 2026 · ${m.r}\n${m.v}\nHora: ${formatTime(m.t)}`);
  const location=encodeURIComponent(m.v);
  return`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=${details}&location=${location}&ctz=America/Mexico_City`;
}
function addOneToCalendar(id){
  const m=ALL_MATCHES_CAL.find(x=>x.id===id);
  if(!m)return;
  window.open(makeGCalUrl(m),'_blank');
  const btn=document.getElementById(`calbtn_${id}`);
  if(btn){btn.textContent='✓ Listo';btn.classList.add('added');}
}
function addRoundToCalendar(rnd){
  const ms=ALL_MATCHES_CAL.filter(m=>m.r===rnd);
  ms.forEach((m,i)=>setTimeout(()=>{window.open(makeGCalUrl(m),'_blank');},i*400));
}
function addAllToCalendar(){
  if(!confirm(`Se abrirán 104 pestañas de Google Calendar.\n¿Continuar?\n\nTip: es mejor usar "Agregar todos" por ronda.`))return;
  ALL_MATCHES_CAL.forEach((m,i)=>setTimeout(()=>window.open(makeGCalUrl(m),'_blank'),i*300));
}

function renderStats(){
  let played=0,goals=0,live=0;
  GL.forEach(g=>S.groupMatches[g].forEach(m=>{if(m.status==='done'){played++;goals+=m.sh+m.sa;}if(m.status==='live')live++;}));
  Object.values(S.knockoutMatches).forEach(arr=>arr.forEach(m=>{if(m.status==='done'){played++;goals+=m.sh+m.sa;}}));
  const avg=played>0?(goals/played).toFixed(1):'—';
  const qt=quinielaTotal();
  document.getElementById('stats-grid').innerHTML=`
    <div class="stat-box"><div class="stat-n">${played}</div><div class="stat-l">Partidos jugados</div></div>
    <div class="stat-box"><div class="stat-n">${goals}</div><div class="stat-l">Goles totales</div></div>
    <div class="stat-box"><div class="stat-n">${avg}</div><div class="stat-l">Promedio goles</div></div>
    <div class="stat-box"><div class="stat-n">${qt.pts}</div><div class="stat-l">Pts quiniela</div></div>
    <div class="stat-box"><div class="stat-n">${qt.exact}</div><div class="stat-l">Exactos</div></div>
    <div class="stat-box"><div class="stat-n">${qt.result}</div><div class="stat-l">Resultados OK</div></div>`;
  document.getElementById('leaders-grid').innerHTML=GL.map(g=>{
    calcS(g);const L=S.standings[g][0];
    return`<div class="leader-box"><div class="leader-g">GRUPO ${g}</div>
      <div style="display:flex;align-items:center;gap:4px;margin-bottom:2px">${badge(L.team)}<span class="leader-name">${L.team}</span></div>
      <div class="leader-pts">${L.pts} pts</div></div>`;
  }).join('');
}

// ── ACCIONES ──────────────────────────────────────────────────────────────────
function setG(g){S.ag=g;renderGSel();renderStandings();}
function setMG(g){S.amg=g;renderMGSel();renderMatches();}
function setQG(g){S.aqg=g;renderQGSel();renderQuiniela();}

function updGS(g,id,s,v){const m=S.groupMatches[g].find(x=>x.id===id);s==='h'?m.sh=v===''?null:+v:m.sa=v===''?null:+v;}
function confirmGM(g,id){
  const m=S.groupMatches[g].find(x=>x.id===id);
  const sh=document.getElementById(`sh_${g}_${id}`).value;
  const sa=document.getElementById(`sa_${g}_${id}`).value;
  if(sh===''||sa===''){alert('Ingresa ambos marcadores');return;}
  m.sh=+sh;m.sa=+sa;m.status='done';calcS(g);saveState();renderMatches();
  if(S.ag===g)renderStandings();
  // actualizar quiniela si está visible
  if(S.aqg===g&&document.getElementById('sec-quiniela').classList.contains('active'))renderQuiniela();
}
function resetGM(g,id){S.groupMatches[g].find(x=>x.id===id).status='pending';saveState();renderMatches();if(S.ag===g)renderStandings();}

function updQ(g,id,s,v){const q=S.quiniela[g].find(x=>x.id===id);s==='h'?q.ph=v===''?null:+v:q.pa=v===''?null:+v;}
function lockQ(g,id){
  const q=S.quiniela[g].find(x=>x.id===id);
  if(q.ph===null||q.pa===null){
    const qh=document.getElementById(`qh_${g}_${id}`).value;
    const qa=document.getElementById(`qa_${g}_${id}`).value;
    if(qh===''||qa===''){alert('Ingresa tu predicción de marcador');return;}
    q.ph=+qh;q.pa=+qa;
  }
  q.locked=true;saveState();renderQuiniela();
}

function updKS(r,id,s,v){const m=S.knockoutMatches[r].find(x=>x.id===id);s==='h'?m.sh=v===''?null:+v:m.sa=v===''?null:+v;}
function confKM(r,id){
  const m=S.knockoutMatches[r].find(x=>x.id===id);
  if(m.sh===null||m.sa===null){alert('Ingresa ambos marcadores');return;}
  if(m.sh===m.sa){alert('En eliminación directa no puede haber empate.\nIngresa el marcador final incluyendo prórroga/penaltis.');return;}
  m.status='done';saveState();renderBracket();
}
function rstKM(r,id){S.knockoutMatches[r].find(x=>x.id===id).status='pending';saveState();renderBracket();}

function switchTab(t,btn){
  document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.section').forEach(e=>e.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('sec-'+t).classList.add('active');
  if(t==='stats')renderStats();
  if(t==='bracket'){resolveKnockout();renderBracket();}
  if(t==='quiniela'){renderQGSel();renderQuiniela();}
  if(t==='calendar')renderCalendar();
}

function boot(){
  renderGSel();renderStandings();
  renderMGSel();renderMatches();
}

loadState();initData();boot();
</script>
